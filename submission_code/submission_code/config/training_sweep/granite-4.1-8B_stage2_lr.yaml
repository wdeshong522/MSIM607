# Stage 2 (learning rate sweep) baseline for Granite-4.1-8B.
# rank/alpha carried forward from Stage 1's decision (see ../../sweep_notes.md).
# output_dir is scoped to stage2_lr/ specifically, separate from Stage 1's
# stage1_rank/ folder, so sweep_summary.py --root on either stage only
# reports that stage's candidates.

model_name:   ibm-granite/granite-4.1-8b
data_dir:     ../data
output_dir:   ./outputs/sweep/stage2_lr/granite-4.1-8b

epochs:       3
batch_size:   1
grad_accum:   8
lr:           2e-4

lora_r:       16
lora_alpha:   32
lora_dropout: 0.05

max_seq_len:  2048
